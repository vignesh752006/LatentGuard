[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdlm-backend"
version = "0.1.0"
description = "VDLM cloud reasoning server for ISRO Problem Statement 26171"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=1.26.0",
    "torch>=2.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "websockets>=13.0",
]
siglip-eval = [
    "transformers>=4.46,<5",
    "pillow>=11.0",
    "onnx>=1.17",
    "onnxconverter-common>=1.14",
    "onnxruntime>=1.20",
    "huggingface-hub>=0.26",
]
inversion-eval = [
    "easyocr>=1.7.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "eval*"]

[tool.setuptools.package-data]
"app.encoding" = ["data/*.bin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
