<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VDLM Demo - Login</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; }
      body { background: #f0f2f5; color: #202124; font: 16px Arial, sans-serif; }
      #app { display: grid; grid-template-rows: 64px 656px; width: 1280px; height: 720px; }
      header {
        display: grid;
        grid-template-columns: 220px 1fr 320px;
        align-items: center;
        padding: 0 32px;
        background: #1a73e8;
        color: white;
      }
      .logo { font-size: 20px; font-weight: 700; }
      header input { grid-column: 2; justify-self: center; width: 300px; height: 38px; padding: 0 12px; }
      main { display: grid; grid-template-columns: 1fr 440px 1fr; align-items: center; }
      .card {
        grid-column: 2;
        display: grid;
        gap: 18px;
        width: 440px;
        padding: 28px 32px;
        border-radius: 8px;
        background: white;
        box-shadow: 0 2px 10px #0002;
      }
      h1 { margin: 0; font-size: 24px; }
      label { display: grid; gap: 7px; color: #5f6368; font-size: 14px; }
      label input { width: 100%; height: 46px; padding: 0 12px; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px; }
      [data-vdlm-sensitive] { width: 376px; height: 68px; }
      canvas { display: block; width: 376px; height: 68px; border: 2px dashed #e53935; }
      .buttons { display: flex; gap: 12px; }
      button { height: 42px; padding: 0 24px; border: 1px solid #dadce0; border-radius: 4px; background: white; font-size: 15px; }
      #btn-login { border-color: #1a73e8; background: #1a73e8; color: white; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <span class="logo">VDLM Demo</span>
        <input id="search" type="search" placeholder="Search">
      </header>
      <main>
        <form class="card" autocomplete="off">
          <h1>Sign in</h1>
          <label for="username">Username
            <input id="username" name="username" type="text" placeholder="demo-user">
          </label>
          <label for="password">Password
            <input id="password" name="password" type="password" autocomplete="current-password">
          </label>
          <div data-vdlm-sensitive="true">
            <canvas id="sensitive-box" width="376" height="68" aria-label="Visible sensitive box"></canvas>
          </div>
          <div class="buttons">
            <button id="btn-login" type="button">Login</button>
            <button id="btn-cancel" type="reset">Cancel</button>
          </div>
        </form>
      </main>
    </div>
    <script>
      const canvas = document.getElementById("sensitive-box");
      const context = canvas.getContext("2d");
      context.fillStyle = "#fff3f3";
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "#b71c1c";
      context.font = "16px Arial";
      context.fillText("Sensitive area", 14, 28);
      context.strokeStyle = "#b71c1c";
      context.strokeRect(14, 38, 200, 18);
    </script>
  </body>
</html>
